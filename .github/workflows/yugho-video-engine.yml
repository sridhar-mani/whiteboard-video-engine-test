name: YUGHO Video Engine

run-name: YUGHO | ${{ inputs.project_path || 'bootstrap-manual' }} | ${{ inputs.profile || 'smoke' }}

on:
  push:
    paths:
      - ".github/workflows/yugho-video-engine.yml"
      - "projects/**/project.json"
      - "pyproject.toml"
      - "render.yaml"
      - "src/**"
      - "tests/**"
  workflow_dispatch:
    inputs:
      project_path:
        description: Git repository path to a YUGHO project JSON file
        required: true
        default: projects/bootstrap/project.json
        type: string
      profile:
        description: Render profile
        required: true
        default: preview
        type: choice
        options:
          - smoke
          - preview
          - final
      segment_id:
        description: Optional single segment ID for a preview render
        required: false
        default: ""
        type: string
      publish:
        description: Upload the completed video to YouTube using repository secrets
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: yugho-video-${{ github.event_name }}-${{ inputs.project_path || 'projects/bootstrap/project.json' }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  verify-render-publish:
    name: Render YUGHO project and optionally publish
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install YUGHO platform
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,youtube,tts]"

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p out/yugho
          python -m pytest -q 2>&1 | tee out/yugho/pytest.log

      - name: Validate project
        shell: bash
        env:
          PROJECT_PATH: ${{ inputs.project_path || 'projects/bootstrap/project.json' }}
          SEGMENT_ID: ${{ inputs.segment_id || '' }}
          PROFILE: ${{ inputs.profile || 'smoke' }}
        run: |
          set -euo pipefail
          case "$PROJECT_PATH" in
            projects/*.json) ;;
            *) echo "project_path must point inside projects/" >&2; exit 1 ;;
          esac

          test -f "$PROJECT_PATH"

          python - "$PROJECT_PATH" "$SEGMENT_ID" "$PROFILE" <<'PY'
          import sys
          from pathlib import Path
          from yugho_video.mcp_server.models import VideoProject
          from yugho_video.video_platform.render_project import get_render_profile

          path = Path(sys.argv[1])
          requested_segment = sys.argv[2].strip()
          profile = sys.argv[3]
          get_render_profile(profile)
          project = VideoProject.model_validate_json(
              path.read_text(encoding="utf-8")
          )

          if requested_segment and requested_segment not in {
              segment.id for segment in project.segments
          }:
              raise SystemExit(
                  f"segment_id {requested_segment!r} is not in project"
              )

          print(f"project_id={project.project_id}")
          print(f"segments={len(project.segments)}")
          print(f"title={project.title}")
          print(f"profile={profile}")
          print(f"audio_provider={project.audio.provider}")
          PY

      - name: Render project or selected segment
        shell: bash
        env:
          PROJECT_PATH: ${{ inputs.project_path || 'projects/bootstrap/project.json' }}
          SEGMENT_ID: ${{ inputs.segment_id || '' }}
          PROFILE: ${{ inputs.profile || 'smoke' }}
        run: |
          set -euo pipefail
          rm -rf out/yugho
          mkdir -p out/yugho

          if [ -n "$SEGMENT_ID" ]; then
            RENDER_ARGS=(--segment-id "$SEGMENT_ID")
          else
            RENDER_ARGS=()
          fi

          /usr/bin/time -f "render_seconds=%e\nmax_rss_kb=%M"             -o out/yugho/render-resource-usage.txt             python -m yugho_video.video_platform.render_project               --project "$PROJECT_PATH"               --output-dir out/yugho               --profile "$PROFILE"               "${RENDER_ARGS[@]}"

          test -s out/yugho/final.mp4

      - name: Validate final MP4
        shell: bash
        env:
          PROFILE: ${{ inputs.profile || 'smoke' }}
        run: |
          set -euo pipefail

          ffprobe -v error             -select_streams v:0             -show_entries stream=codec_name,width,height,r_frame_rate             -show_entries format=duration,size             -of json             out/yugho/final.mp4 > out/yugho/video-metadata.json

          python - <<'PY'
          import json
          import os
          from fractions import Fraction
          from yugho_video.video_platform.render_project import get_render_profile
          from pathlib import Path

          meta = json.loads(
              Path("out/yugho/video-metadata.json").read_text()
          )
          stream = meta["streams"][0]
          fmt = meta["format"]

          width = int(stream["width"])
          height = int(stream["height"])
          fps = float(Fraction(stream["r_frame_rate"]))
          duration = float(fmt["duration"])
          size = int(fmt["size"])

          expected = get_render_profile(os.environ["PROFILE"])
          assert (width, height) == (
              int(expected["width"]),
              int(expected["height"]),
          ), (width, height, expected)
          assert abs(fps - int(expected["fps"])) < 0.1, (fps, expected)
          assert duration > 0 and size > 0

          print(
              f"resolution={width}x{height} "
              f"fps={fps:.2f} duration={duration:.2f}s bytes={size}"
          )
          PY

      - name: Generate thumbnail
        shell: bash
        run: |
          ffmpeg -hide_banner -loglevel error -y             -ss 1             -i out/yugho/final.mp4             -frames:v 1             -q:v 2             out/yugho/thumbnail.jpg
          test -s out/yugho/thumbnail.jpg

      - name: Publish to YouTube
        if: ${{ (inputs.publish || false) == true && (inputs.segment_id || '') == '' }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PROJECT_PATH: ${{ inputs.project_path }}
        shell: bash
        run: |
          set -euo pipefail
          python -m yugho_video.video_platform.youtube             --project "$PROJECT_PATH"             --video out/yugho/final.mp4             --thumbnail out/yugho/thumbnail.jpg             --captions out/yugho/captions.srt             > out/yugho/youtube-result.json
          cat out/yugho/youtube-result.json

      - name: Prepare project result
        if: always()
        shell: bash
        env:
          PROJECT_PATH: ${{ inputs.project_path || 'projects/bootstrap/project.json' }}
          SEGMENT_ID: ${{ inputs.segment_id || '' }}
          PROFILE: ${{ inputs.profile || 'smoke' }}
          REQUESTED_PUBLISH: ${{ inputs.publish || false }}
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          mkdir -p out/yugho

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          project_path = os.environ["PROJECT_PATH"]
          project_file = Path(project_path)
          project = json.loads(project_file.read_text(encoding="utf-8"))

          youtube = None
          result_file = Path("out/yugho/youtube-result.json")
          if result_file.exists():
              try:
                  youtube = json.loads(result_file.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  youtube = None

          manifest = {}
          manifest_file = Path("out/yugho/project-manifest.json")
          if manifest_file.exists():
              try:
                  manifest = json.loads(manifest_file.read_text(encoding="utf-8"))
              except json.JSONDecodeError:
                  manifest = {}

          state = "succeeded"
          if os.environ["JOB_STATUS"] != "success":
              state = "failed"

          result = {
              "schema_version": "1.0",
              "state": state,
              "project_id": project["project_id"],
              "title": project["title"],
              "run_id": int(os.environ["RUN_ID"]),
              "run_url": os.environ["RUN_URL"],
              "profile": os.environ["PROFILE"],
              "segment_id": os.environ["SEGMENT_ID"] or None,
              "requested_publish": os.environ["REQUESTED_PUBLISH"] == "true",
              "youtube": youtube,
              "render_manifest": manifest,
          }

          output = Path("out/yugho/result.json")
          output.write_text(
              json.dumps(result, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY



      - name: Persist project result for MCP status
        if: ${{ github.event_name == 'workflow_dispatch' && always() }}
        shell: bash
        env:
          PROJECT_PATH: ${{ inputs.project_path || 'projects/bootstrap/project.json' }}
        run: |
          set -euo pipefail

          PROJECT_ID="$(python -c 'import json; print(json.load(open("'"$PROJECT_PATH"'"))["project_id"])')"
          RESULT_PATH="projects/$PROJECT_ID/result.json"
          mkdir -p "$(dirname "$RESULT_PATH")"
          cp out/yugho/result.json "$RESULT_PATH"

          git config user.name "yugho-video-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RESULT_PATH"
          git diff --cached --quiet || git commit -m "video: record render result for $PROJECT_ID"
          git push
      - name: Upload workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yugho-project-${{ github.run_id }}
          path: out/yugho/
          if-no-files-found: error
          retention-days: 3

      - name: Job summary
        if: always()
        shell: bash
        env:
          PROJECT_PATH: ${{ inputs.project_path || 'projects/bootstrap/project.json' }}
          PROFILE: ${{ inputs.profile || 'smoke' }}
          SEGMENT_ID: ${{ inputs.segment_id || '' }}
          PUBLISH: ${{ inputs.publish || false }}
        run: |
          {
            echo "## YUGHO Video Project"
            echo ""
            echo "| Parameter | Value |"
            echo "|---|---|"
            echo "| Project | `$PROJECT_PATH` |"
            echo "| Profile | $PROFILE |"
            echo "| Segment | ${SEGMENT_ID:-full project} |"
            echo "| Publish | $PUBLISH |"
            echo "| Output | final.mp4 |"
            echo ""
            echo "The final video, thumbnail, captions, manifest, render-resource report, and result are attached as the workflow artifact."
          } >> "$GITHUB_STEP_SUMMARY"
