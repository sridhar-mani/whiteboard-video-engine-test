name: YUGHO Video Engine

run-name: YUGHO | ${{ inputs.project_path || 'bootstrap-manual' }} | ${{ inputs.profile || 'smoke' }}

on:
  workflow_dispatch:
    inputs:
      project_path:
        description: Git repository path to a YUGHO project JSON file
        required: true
        default: projects/bootstrap/project.json
        type: string
      profile:
        description: Render profile
        required: true
        default: preview
        type: choice
        options:
          - smoke
          - preview
          - final
      publish:
        description: Upload the completed video to YouTube using repository secrets
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: yugho-video-project-${{ inputs.project_path }}
  cancel-in-progress: false

jobs:
  verify-render-publish:
    name: Render YUGHO project and optionally publish
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install FFmpeg
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Install renderer, MCP schemas, and test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install -r src/yugho_video/mcp_server/requirements.txt

      - name: Install YouTube dependencies when publishing
        if: ${{ inputs.publish == true }}
        shell: bash
        run: python -m pip install -r src/yugho_video/video_platform/requirements.txt

      - name: Run unit tests
        shell: bash
        run: python -m pytest -q

      - name: Validate project
        shell: bash
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          test -f "$PROJECT_PATH"
          python - "$PROJECT_PATH" <<'PY'
          import sys
          from pathlib import Path
          from yugho_video.mcp_server.models import VideoProject

          path = Path(sys.argv[1])
          project = VideoProject.model_validate_json(
              path.read_text(encoding="utf-8")
          )
          print(f"project_id={project.project_id}")
          print(f"segments={len(project.segments)}")
          print(f"title={project.title}")
          PY

      - name: Render project segments and compose master
        shell: bash
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
        run: |
          set -euo pipefail
          rm -rf out/yugho
          mkdir -p out/yugho

          /usr/bin/time -f "render_seconds=%e\nmax_rss_kb=%M" \
            -o out/yugho/render-resource-usage.txt \
            python -m yugho_video.video_platform.render_project \
              --project "$PROJECT_PATH" \
              --output-dir out/yugho

          test -s out/yugho/final.mp4

      - name: Validate final MP4
        shell: bash
        run: |
          set -euo pipefail

          ffprobe -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -show_entries format=duration,size \
            -of json \
            out/yugho/final.mp4 > out/yugho/video-metadata.json

          python - <<'PY'
          import json
          from fractions import Fraction
          from pathlib import Path

          meta = json.loads(
              Path("out/yugho/video-metadata.json").read_text()
          )
          stream = meta["streams"][0]
          fmt = meta["format"]

          width = int(stream["width"])
          height = int(stream["height"])
          fps = float(Fraction(stream["r_frame_rate"]))
          duration = float(fmt["duration"])
          size = int(fmt["size"])

          assert (width, height) == (1920, 1080), (width, height)
          assert 23.9 <= fps <= 30.1, fps
          assert duration > 0 and size > 0

          print(
              f"resolution={width}x{height} "
              f"fps={fps:.2f} duration={duration:.2f}s bytes={size}"
          )
          PY

      - name: Generate thumbnail
        shell: bash
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -ss 1 \
            -i out/yugho/final.mp4 \
            -frames:v 1 \
            -q:v 2 \
            out/yugho/thumbnail.jpg

      - name: Publish to YouTube
        if: ${{ inputs.publish == true }}
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          PROJECT_PATH: ${{ inputs.project_path }}
        shell: bash
        run: |
          set -euo pipefail

          test -f out/yugho/captions.srt || true

          python -m yugho_video.video_platform.youtube \
            --project "$PROJECT_PATH" \
            --video out/yugho/final.mp4 \
            --thumbnail out/yugho/thumbnail.jpg \
            --captions out/yugho/captions.srt \
            | tee out/yugho/youtube-result.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: yugho-project-${{ github.run_id }}
          path: out/yugho/
          if-no-files-found: error
          retention-days: 3

      - name: Job summary
        shell: bash
        env:
          PROJECT_PATH: ${{ inputs.project_path }}
          PROFILE: ${{ inputs.profile }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          {
            echo "## YUGHO Video Project"
            echo ""
            echo "| Parameter | Value |"
            echo "|---|---|"
            echo "| Project | \`$PROJECT_PATH\` |"
            echo "| Profile | $PROFILE |"
            echo "| Publish | $PUBLISH |"
            echo "| Output | final.mp4 |"
            echo ""
            echo "The render, thumbnail, captions, metadata, and resource report are attached as the workflow artifact."
          } >> "$GITHUB_STEP_SUMMARY"
