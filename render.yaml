services:
  - type: web
    name: yugho-video-mcp
    runtime: python
    plan: free
    healthCheckPath: /health
    buildCommand: pip install -e '.[dev]'
    startCommand: yugho-video-mcp
    autoDeploy: true
    buildFilter:
      paths:
        - src/yugho_video/**
        - src/whiteboard_skill/**
        - pyproject.toml
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: sridhar-mani/whiteboard-video-engine-test
      - key: GITHUB_WORKFLOW
        value: yugho-video-engine.yml
      - key: GITHUB_REF
        value: main
      - key: MCP_PUBLIC_URL
        sync: false
      - key: MCP_AUTH_ISSUER
        sync: false
      - key: MCP_AUTH_AUDIENCE
        sync: false
      - key: MCP_AUTH_JWKS_URL
        sync: false
      - key: MCP_AUTH_REQUIRED_SCOPES
        value: mcp:write
