services:
  - type: web
    name: yugho-video-mcp
    runtime: python
    plan: free
    buildCommand: pip install -e . && pip install -r src/yugho_video/mcp_server/requirements.txt
    startCommand: python -m yugho_video.mcp_server.server
    autoDeploy: true
    buildFilter:
      paths:
        - src/yugho_video/**
        - src/whiteboard_skill/**
        - pyproject.toml
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: sridhar-mani/whiteboard-video-engine-test
      - key: GITHUB_WORKFLOW
        value: yugho-video-engine.yml
      - key: GITHUB_REF
        value: main
